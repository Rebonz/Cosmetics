<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة | Rebonz Cosmetics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FBF0EC; --rose-deep: #B23A5C; --rose-deep-2: #96304D;
            --rose-soft: #F7D9E1; --plum-ink: #2B1620; --mauve: #7C5163;
            --paper: #FFFDFC; --shadow: 0 18px 40px -18px rgba(43,22,32,0.35);
            --font-display: 'Lalezar', sans-serif; --font-body: 'Tajawal', sans-serif;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: var(--font-body); background: var(--cream); color: var(--plum-ink); line-height: 1.6; }
        .container { max-width: 1100px; margin: 40px auto; padding: 0 24px; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header-bar h1 { font-family: var(--font-display); font-size: 2.2rem; margin: 0; color: var(--rose-deep); }
        .back-link { color: var(--mauve); text-decoration: none; font-weight: 700; display: flex; align-items: center; gap: 6px; transition: color .2s; }
        .back-link:hover { color: var(--rose-deep); }

        .status { padding: 14px 20px; background: var(--rose-soft); color: var(--rose-deep-2); border-radius: 12px; margin-bottom: 24px; font-weight: 700; font-size: 0.95rem; border: 1px solid rgba(178,58,92,0.15); }
        .status.error { background: #fee2e2; color: #991b1b; border-color: rgba(153,27,27,0.2); }

        .form-card { background: var(--paper); padding: 32px; border-radius: 24px; margin-bottom: 40px; box-shadow: var(--shadow); border: 1px solid rgba(43,22,32,0.06); }
        .form-card h2 { font-family: var(--font-display); font-size: 1.6rem; margin: 0 0 24px; color: var(--plum-ink); }
        
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group.full { grid-column: 1 / -1; }
        label { font-weight: 700; font-size: 0.95rem; color: var(--mauve); }
        
        input, textarea { width: 100%; padding: 14px 18px; border: 1.5px solid rgba(43,22,32,0.15); border-radius: 14px; font-family: inherit; font-size: 1rem; background: var(--cream); color: var(--plum-ink); transition: border-color .2s, box-shadow .2s; }
        input:focus, textarea:focus { outline: none; border-color: var(--rose-deep); box-shadow: 0 0 0 3px rgba(178,58,92,0.1); background: var(--paper); }
        textarea { min-height: 110px; resize: vertical; }

        .btn { border: none; padding: 14px 28px; border-radius: 999px; cursor: pointer; font-family: inherit; font-size: 1rem; font-weight: 700; transition: transform .2s, box-shadow .2s, background .2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--rose-deep); color: var(--paper); box-shadow: 0 8px 20px -6px rgba(178,58,92,0.4); }
        .btn-primary:hover { background: var(--rose-deep-2); transform: translateY(-2px); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .btn-secondary { background: transparent; color: var(--plum-ink); border: 1.5px solid rgba(43,22,32,0.2); }
        .btn-secondary:hover { border-color: var(--rose-deep); color: var(--rose-deep); background: var(--rose-soft); }
        
        .btn-danger { background: #fee2e2; color: #991b1b; border: 1px solid rgba(153,27,27,0.2); padding: 8px 16px; font-size: 0.9rem; border-radius: 12px; }
        .btn-danger:hover { background: #fecaca; }
        
        .btn-edit { background: var(--rose-soft); color: var(--rose-deep-2); padding: 8px 16px; font-size: 0.9rem; border-radius: 12px; margin-left: 8px; }
        .btn-edit:hover { background: var(--rose-mid); }

        .actions { display: flex; gap: 12px; margin-top: 24px; }

        .preview-container { margin-top: 12px; }
        .preview-container img { width: 160px; height: 160px; object-fit: cover; border-radius: 16px; border: 3px solid var(--paper); box-shadow: 0 8px 20px -8px rgba(0,0,0,0.15); }

        .products-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .products-header h2 { font-family: var(--font-display); font-size: 1.8rem; margin: 0; }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }
        .product-card { background: var(--paper); border-radius: 20px; overflow: hidden; box-shadow: 0 10px 24px -12px rgba(43,22,32,0.2); border: 1px solid rgba(43,22,32,0.06); transition: transform .25s ease; }
        .product-card:hover { transform: translateY(-4px); }
        
        .product-image-container { width: 100%; height: 200px; background: var(--cream); position: relative; overflow: hidden; }
        .product-image { width: 100%; height: 100%; object-fit: cover; }
        .no-image { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--mauve); font-size: 0.9rem; }
        
        .product-content { padding: 18px; }
        .product-name { font-family: var(--font-display); font-size: 1.2rem; margin-bottom: 6px; color: var(--plum-ink); }
        .product-category { display: inline-block; background: var(--rose-soft); color: var(--rose-deep-2); padding: 4px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; margin-bottom: 10px; }
        .product-description { color: var(--mauve); font-size: 0.9rem; min-height: 40px; margin-bottom: 12px; line-height: 1.5; }
        .product-price { font-size: 1.1rem; font-weight: 800; color: var(--rose-deep); margin-bottom: 4px; }
        .product-stock { font-size: 0.85rem; color: var(--mauve); margin-bottom: 16px; }
        
        .card-actions { display: flex; gap: 8px; }
        .card-actions .btn { flex: 1; padding: 10px; font-size: 0.9rem; }

        .loading { text-align: center; padding: 40px; color: var(--mauve); grid-column: 1 / -1; }
        .empty { text-align: center; padding: 60px 20px; color: var(--mauve); background: var(--paper); border-radius: 20px; grid-column: 1 / -1; }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .products-grid { grid-template-columns: 1fr; }
            .header-bar { flex-direction: column; align-items: flex-start; gap: 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h1>⚙️ إدارة منتجات Rebonz</h1>
        <a href="index.html" class="back-link">← العودة للموقع الرئيسي</a>
    </div>

    <div class="status" id="status">جاري الاتصال بـ Supabase...</div>

    <div class="form-card">
        <h2 id="formTitle">إضافة منتج جديد</h2>
        <form id="productForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="name">اسم المنتج *</label>
                    <input type="text" id="name" required placeholder="مثال: زيت شفاه Aura Petal">
                </div>
                <div class="form-group">
                    <label for="category">التصنيف</label>
                    <input type="text" id="category" placeholder="مثال: عناية بالشفاه">
                </div>
                <div class="form-group">
                    <label for="price">السعر (ج.م) *</label>
                    <input type="number" id="price" step="0.01" min="0" required placeholder="0.00">
                </div>
                <div class="form-group">
                    <label for="stock">المخزون</label>
                    <input type="number" id="stock" min="0" value="0" placeholder="0">
                </div>
                <div class="form-group full">
                    <label for="description">الوصف</label>
                    <textarea id="description" placeholder="اكتبي وصفاً جذاباً للمنتج..."></textarea>
                </div>
                <div class="form-group full">
                    <label for="image">صورة المنتج</label>
                    <input type="file" id="image" accept="image/jpeg,image/png,image/webp,image/gif">
                    <small style="color:var(--mauve); font-size:0.85rem;">JPG / PNG / WEBP - الحد الأقصى 5 MB</small>
                    <div class="preview-container" id="imagePreview"></div>
                </div>
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-primary" id="saveButton">إضافة المنتج</button>
                <button type="button" class="btn btn-secondary" id="cancelButton" style="display:none;">إلغاء التعديل</button>
            </div>
        </form>
    </div>

    <div class="products-header">
        <h2>المنتجات الحالية</h2>
        <button class="btn btn-secondary" onclick="loadProducts()">🔄 تحديث القائمة</button>
    </div>

    <div id="productsContainer" class="products-grid">
        <div class="loading">جاري تحميل المنتجات...</div>
    </div>
</div>

<script>
    // ======================================================
    // Supabase Settings
    // ======================================================
    const SUPABASE_URL = "https://bxnoptezcizpryzbxcjr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_kgPlJ5qLDEdBkAfjOwVVkg_GVQ9fzud"; // ⚠️ استبدل هذا بالمفتاح الحقيقي
    const STORAGE_BUCKET = "product-images";

    const headers = {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json"
    };

    let editingProductId = null;
    let editingOldImageUrl = null;

    const productForm = document.getElementById("productForm");
    const nameInput = document.getElementById("name");
    const descriptionInput = document.getElementById("description");
    const priceInput = document.getElementById("price");
    const stockInput = document.getElementById("stock");
    const categoryInput = document.getElementById("category");
    const imageInput = document.getElementById("image");
    const imagePreview = document.getElementById("imagePreview");
    const productsContainer = document.getElementById("productsContainer");
    const statusElement = document.getElementById("status");
    const formTitle = document.getElementById("formTitle");
    const saveButton = document.getElementById("saveButton");
    const cancelButton = document.getElementById("cancelButton");

    // Preview Image
    imageInput.addEventListener("change", function () {
        const file = this.files[0];
        if (!file) { imagePreview.innerHTML = ""; return; }
        if (!file.type.startsWith("image/")) { alert("الملف يجب أن يكون صورة"); this.value = ""; return; }
        if (file.size > 5 * 1024 * 1024) { alert("حجم الصورة يجب ألا يتجاوز 5 MB"); this.value = ""; return; }
        
        const reader = new FileReader();
        reader.onload = function (event) {
            imagePreview.innerHTML = `<img src="${event.target.result}" alt="Preview">`;
        };
        reader.readAsDataURL(file);
    });

    async function uploadProductImage(file) {
        if (!file) return null;
        const extension = file.name.split(".").pop().toLowerCase();
        const fileName = `${crypto.randomUUID()}.${extension}`;
        const filePath = `products/${fileName}`;
        const uploadUrl = `${SUPABASE_URL}/storage/v1/object/${STORAGE_BUCKET}/${filePath}`;

        const response = await fetch(uploadUrl, {
            method: "POST",
            headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": file.type, "x-upsert": "false" },
            body: file
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.message || result.error || "فشل رفع الصورة");
        
        return `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${filePath}`;
    }

    async function deleteProductImage(imageUrl) {
        if (!imageUrl) return;
        try {
            const marker = `/storage/v1/object/public/${STORAGE_BUCKET}/`;
            const index = imageUrl.indexOf(marker);
            if (index === -1) return;
            const filePath = imageUrl.substring(index + marker.length);
            await fetch(`${SUPABASE_URL}/storage/v1/object/${STORAGE_BUCKET}/${filePath}`, {
                method: "DELETE",
                headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
            });
        } catch (error) { console.error("Delete image error:", error); }
    }

    async function loadProducts() {
        productsContainer.innerHTML = `<div class="loading">جاري تحميل المنتجات...</div>`;
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*&order=id.desc`, { method: "GET", headers });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || "فشل تحميل المنتجات");
            
            statusElement.className = "status";
            statusElement.innerHTML = `✅ تم الاتصال بنجاح - عدد المنتجات: ${result.length}`;
            displayProducts(result);
        } catch (error) {
            statusElement.className = "status error";
            statusElement.innerHTML = `❌ خطأ في الاتصال: ${error.message}`;
            productsContainer.innerHTML = `<div class="empty">فشل تحميل المنتجات<br><br>${escapeHtml(error.message)}</div>`;
        }
    }

    function displayProducts(products) {
        if (!products.length) {
            productsContainer.innerHTML = `<div class="empty">لا توجد منتجات حتى الآن</div>`;
            return;
        }
        productsContainer.innerHTML = products.map(product => `
            <div class="product-card">
                <div class="product-image-container">
                    ${product.image_url ? 
                        `<img src="${escapeHtml(product.image_url)}" alt="${escapeHtml(product.name)}" class="product-image" loading="lazy" onerror="this.style.display='none'; this.parentElement.querySelector('.no-image').style.display='flex';">
                         <div class="no-image" style="display:none;">الصورة غير متاحة</div>` : 
                        `<div class="no-image">لا توجد صورة</div>`
                    }
                </div>
                <div class="product-content">
                    <div class="product-name">${escapeHtml(product.name)}</div>
                    ${product.category ? `<span class="product-category">${escapeHtml(product.category)}</span>` : ""}
                    <div class="product-description">${escapeHtml(product.description || "")}</div>
                    <div class="product-price">${formatPrice(product.price)} ج.م</div>
                    <div class="product-stock">المخزون: ${product.stock ?? 0}</div>
                    <div class="card-actions">
                        <button class="btn btn-edit" onclick="editProduct(${product.id})">تعديل</button>
                        <button class="btn btn-danger" onclick="removeProduct(${product.id})">حذف</button>
                    </div>
                </div>
            </div>
        `).join("");
    }

    async function editProduct(id) {
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${id}&select=*`, { method: "GET", headers });
            const result = await response.json();
            if (!response.ok || !result.length) throw new Error("فشل تحميل المنتج");
            
            const product = result[0];
            editingProductId = product.id;
            editingOldImageUrl = product.image_url;
            
            nameInput.value = product.name || "";
            descriptionInput.value = product.description || "";
            priceInput.value = product.price ?? 0;
            stockInput.value = product.stock ?? 0;
            categoryInput.value = product.category || "";
            imageInput.value = "";
            
            if (product.image_url) {
                imagePreview.innerHTML = `<div style="margin-bottom:8px; font-size:0.9rem; color:var(--mauve);">الصورة الحالية:</div><img src="${escapeHtml(product.image_url)}" alt="Current Image">`;
            } else {
                imagePreview.innerHTML = "";
            }
            
            formTitle.innerText = "تعديل المنتج";
            saveButton.innerText = "حفظ التعديلات";
            cancelButton.style.display = "inline-flex";
            window.scrollTo({ top: 0, behavior: "smooth" });
        } catch (error) { alert(error.message); }
    }

    productForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        try {
            saveButton.disabled = true;
            saveButton.innerText = "جاري الحفظ...";
            const file = imageInput.files[0];
            let imageUrl = editingOldImageUrl;
            
            if (file) imageUrl = await uploadProductImage(file);
            
            const product = {
                name: nameInput.value.trim(),
                description: descriptionInput.value.trim(),
                price: parseFloat(priceInput.value) || 0,
                stock: parseInt(stockInput.value) || 0,
                category: categoryInput.value.trim(),
                image_url: imageUrl,
                is_active: true
            };

            if (!editingProductId) {
                await fetch(`${SUPABASE_URL}/rest/v1/products`, { method: "POST", headers: { ...headers, Prefer: "return=representation" }, body: JSON.stringify(product) });
                alert("تم إضافة المنتج بنجاح 🎉");
            } else {
                await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${editingProductId}`, { method: "PATCH", headers: { ...headers, Prefer: "return=representation" }, body: JSON.stringify(product) });
                if (file && editingOldImageUrl && editingOldImageUrl !== imageUrl) await deleteProductImage(editingOldImageUrl);
                alert("تم تعديل المنتج بنجاح ✅");
            }
            
            resetForm();
            await loadProducts();
        } catch (error) { alert("خطأ: " + error.message); }
        finally {
            saveButton.disabled = false;
            saveButton.innerText = editingProductId ? "حفظ التعديلات" : "إضافة المنتج";
        }
    });

    async function removeProduct(id) {
        if (!confirm("هل أنت متأكد من حذف هذا المنتج؟ لا يمكن التراجع عن هذا الإجراء.")) return;
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${id}&select=*`, { method: "GET", headers });
            const products = await response.json();
            await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${id}`, { method: "DELETE", headers });
            
            if (products[0]?.image_url) await deleteProductImage(products[0].image_url);
            alert("تم حذف المنتج بنجاح");
            await loadProducts();
        } catch (error) { alert("خطأ في الحذف: " + error.message); }
    }

    cancelButton.addEventListener("click", resetForm);

    function resetForm() {
        editingProductId = null;
        editingOldImageUrl = null;
        productForm.reset();
        imagePreview.innerHTML = "";
        formTitle.innerText = "إضافة منتج جديد";
        saveButton.innerText = "إضافة المنتج";
        cancelButton.style.display = "none";
    }

    function formatPrice(price) { return (parseFloat(price) || 0).toLocaleString("ar-EG", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function escapeHtml(value) { if (value === null || value === undefined) return ""; return String(value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

    // Start
    loadProducts();
</script>
</body>
</html>
